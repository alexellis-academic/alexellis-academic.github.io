<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alex Ellis</title>

  <!-- Apply the theme before the page is painted -->
  <script>
    (() => {
      const savedTheme = localStorage.getItem("theme");

      const systemPrefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      const startingTheme =
        savedTheme || (systemPrefersDark ? "dark" : "light");

      document.documentElement.dataset.theme = startingTheme;
    })();
  </script>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <nav class="top-nav" aria-label="Main navigation">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="research.html">Research</a>
      <a href="writing.html">Writing</a>
      <a href="design.html">Design</a>
      <a href="media.html">Media</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="nav-controls">
      <div class="nav-dots" aria-hidden="true">
        <span class="dot-light"></span>
        <span class="dot-medium"></span>
        <span class="dot-dark"></span>
      </div>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <span class="theme-icon" aria-hidden="true">☾</span>
      </button>
    </div>
  </nav>

  <main class="site">
    <header class="page-header">
      <p class="eyebrow">Media</p>

    </header>
    
<section class="project-card">

      <p>"All Candidates Forum"</p>
      <a href="https://thevarsity.ca/2026/03/11/highlights-from-2026-utmsu-all-candidates-forum/">Visit Article</a>
    </section>
  </main>

</body>
</html>
