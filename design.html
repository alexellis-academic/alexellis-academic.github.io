<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="color-scheme" content="light dark">

  <title>Alex Ellis</title>

  <!-- This must be before style.css -->
  <script>
    (() => {
      const savedTheme = localStorage.getItem("theme");

      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      const theme =
        savedTheme || (prefersDark ? "dark" : "light");

      const root = document.documentElement;

      root.dataset.theme = theme;
      root.classList.add("theme-loading");

      /*
        Apply a background immediately, before CSS finishes loading.
        This is especially helpful on mobile browsers.
      */
      root.style.backgroundColor =
        theme === "dark" ? "#121812" : "#fbfdfb";
    })();
  </script>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <nav class="top-nav" aria-label="Main navigation">
    <div class="nav-links">

      <a href="research.html">Research</a>
      <a href="writing.html">Writing</a>
      <a href="design.html">Design</a>
      <a href="media.html">Media</a>
      <a href="contact.html">Contact</a>
    </div>

    <div class="nav-controls">
      <div class="nav-dots" aria-hidden="true">
        <span class="dot-light"></span>
        <span class="dot-medium"></span>
        <span class="dot-dark"></span>
      </div>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        aria-pressed="false"

        <span class="theme-icon" aria-hidden="true">☾</span>

    </div>
  </nav>
