<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY WARNING</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #screen-wrapper {
            width: 95%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Video fills the top slot of our column layout */
        #video-container {
            display: none;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border: 2px solid #ff0000;
            position: relative; 
        }

        iframe, #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        #trap-shield {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
        }

        /* Content block is pinned below the video container */
        #ui-content {
            text-align: center;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px 0;
            line-height: 1.4;
        }

        #timer {
            font-size: 3rem; 
            font-weight: bold;
            margin: 5px 0;
            color: #fff;
        }

        /* Safe, non-flashing layout drift for the fail state */
        @keyframes safeDrift {
            0% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
            100% { transform: translateX(0); }
        }

        .glitched-state {
            animation: safeDrift 0.3s ease-in-out infinite !important;
        }
    </style>
</head>
<body>

    <div id="screen-wrapper">
        <!-- Video sits on top so text is never buried below the fold -->
        <div id="video-container">
            <div id="trap-shield"></div>
            <div id="player"></div>
        </div>

        <div id="ui-content">
            <h1 id="status-message">YOU HAVE ACTIVATED A DANCE TRIPWIRE.</h1>
            <div id="timer">5</div>
        </div>
    </div>

<script>
    const HOME_URL = "index.html";
    const SUCCESS_URL = "clearance_granted.html";

    const DANCE_VIDEOS = [
        { id: "ZkXD2XpJnCg", start: 0, duration: 0 },
        { id: "ZkXD2XpJnCg", start: 38, duration: 20 },
        { id: "GxKspeYAFYw", start: 0, duration: 0 }
    ];

    let countdown = 5;
    let tripwireActive = false;
    let timerInterval;
    let successTimeout;
    let glitchInterval;
    let player;
    let selectedVideo;

    const timerDisplay = document.getElementById("timer");
    const statusMessage = document.getElementById("status-message");
    const videoContainer = document.getElementById("video-container");
    const trapShield = document.getElementById("trap-shield");

    function startCountdown() {
        timerDisplay.innerText = countdown;
        timerInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerDisplay.innerText = countdown;
            } else {
                clearInterval(timerInterval);
                timerDisplay.innerText = "LIVE";
                timerDisplay.style.color = "#ff0000";
                activateTripwire();
            }
        }, 1000);
    }

    startCountdown();

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        selectedVideo = DANCE_VIDEOS[Math.floor(Math.random() * DANCE_VIDEOS.length)];

        player = new YT.Player("player", {
            videoId: selectedVideo.id,
            playerVars: {
                autoplay: 1,
                controls: 0,
                disablekb: 1,
                modestbranding: 1,
                rel: 0,
                start: selectedVideo.start,
                mute: 1,
                playsinline: 1
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: handlePlayerStateChange
            }
        });
    }

    function onPlayerReady() {
        const iframe = document.querySelector("#player iframe");
        if (iframe) {
            iframe.setAttribute("allow", "autoplay; encrypted-media");
        }
        if (player && typeof player.playVideo === "function") {
            player.playVideo();
        }
    }

    function activateTripwire() {
        tripwireActive = true;
        statusMessage.innerHTML = "TRIPWIRE ARMED.<br>DO NOT TOUCH CONTROLS. DANCE.";
        videoContainer.style.display = "block";
        trapShield.style.display = "block";

        window.addEventListener("keydown", triggerFail);
        window.addEventListener("mousemove", triggerFail);
        window.addEventListener("mousedown", triggerFail);

        trapShield.addEventListener("mousemove", triggerFail);
        trapShield.addEventListener("mousedown", triggerFail);

        if (selectedVideo && selectedVideo.duration > 0) {
            successTimeout = setTimeout(() => {
                if (tripwireActive) triggerSuccess();
            }, selectedVideo.duration * 1000);
        }
    }

    function handlePlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED && selectedVideo && selectedVideo.duration === 0 && tripwireActive) {
            triggerSuccess();
        }
    }

    function triggerSuccess() {
        if (!tripwireActive) return;

        tripwireActive = false;
        clearTimeout(successTimeout);
        localStorage.setItem("tripwire_passed", "yes");
        
        window.removeEventListener("keydown", triggerFail);
        window.removeEventListener("mousemove", triggerFail);
        window.removeEventListener("mousedown", triggerFail);

        document.body.style.backgroundColor = "#002200";
        statusMessage.style.color = "#00ff00";
        statusMessage.innerText = "CLEARANCE RETAINED. ACCESS GRANTED.";
        timerDisplay.innerText = "PASS";
        timerDisplay.style.color = "#00ff00";
        videoContainer.style.display = "none";

        setTimeout(() => {
            window.location.href = SUCCESS_URL;
        }, 2000);
    }

    function triggerFail() {
        if (!tripwireActive) return;

        tripwireActive = false;
        clearTimeout(successTimeout);
        localStorage.removeItem("tripwire_passed");

        window.removeEventListener("keydown", triggerFail);
        window.removeEventListener("mousemove", triggerFail);
        window.removeEventListener("mousedown", triggerFail);
        trapShield.removeEventListener("mousemove", triggerFail);
        trapShield.removeEventListener("mousedown", triggerFail);

        // Gently shifts the content container slightly to simulate distortion (completely seizure safe)
        document.getElementById("ui-content").classList.add("glitched-state");
        
        // Slower text-rotation cycle (every 250ms) to look like a Terminal crash without strobe elements
        const corruptedStrings = [
            "CRITICAL_EXCEPTION", 
            "ACCESS_DENIED_SYS_403", 
            "REBOOTING_SYSTEM...", 
            "TRIPWIRE_TRIPPED_ERR"
        ];
        
        let counter = 0;
        glitchInterval = setInterval(() => {
            statusMessage.innerText = corruptedStrings[counter % corruptedStrings.length];
            timerDisplay.innerText = "0x" + Math.floor(Math.random() * 999).toString(16).toUpperCase();
            counter++;
        }, 250);

        // Hide video container so player focuses purely on the terminal text crash output
        videoContainer.style.display = "none";
        trapShield.style.display = "none";

        if (player && typeof player.stopVideo === "function") {
            player.stopVideo();
        }

        setTimeout(() => {
            clearInterval(glitchInterval);
            document.getElementById("ui-content").classList.remove("glitched-state");
            window.location.href = HOME_URL;
        }, 2000); 
    }
</script>
</body>
</html>
