<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY WARNING</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            user-select: none;
        }

        #screen-wrapper {
            width: 95%;
            max-width: 1200px; /* Expanded layout scale for larger video canvas */
            position: relative;
        }

        h1 {
            font-size: 1.25rem; /* Scaled down layout text */
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: blink 1s infinite alternate;
        }

        #timer {
            font-size: 3rem; /* Scaled down landing layout timer text */
            font-weight: bold;
            margin: 10px 0;
            color: #fff;
        }

        #video-container {
            display: none;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border: 2px solid #ff0000;
            margin-top: 15px;
            position: relative; 
        }

        iframe, #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        #trap-shield {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
        }

        /* Glitch Animation Keyframes */
        @keyframes structuralGlitch {
            0% { transform: translate(0) skew(0deg); filter: hue-rotate(0deg); }
            10% { transform: translate(-4px, 2px) skew(-5deg); filter: hue-rotate(90deg); text-shadow: 3px 0 #00ff00, -3px 0 #0000ff; }
            20% { transform: translate(3px, -3px) skew(3deg); filter: hue-rotate(180deg); }
            30% { transform: translate(0) skew(0deg); filter: none; text-shadow: none; }
            40% { transform: translate(-2px, -1px) skew(-2deg); }
            50% { transform: translate(5px, 4px) skew(8deg); filter: invert(1); text-shadow: -4px 0 #ffff00, 4px 0 #ff00ff; }
            55% { transform: translate(0) skew(0deg); filter: none; text-shadow: none; }
            100% { transform: translate(0) skew(0deg); }
        }

        .glitched-state {
            animation: structuralGlitch 0.15s infinite !important;
            color: #fff !important;
            background-color: #1a0000 !important;
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="screen-wrapper">
        <h1 id="status-message">YOU HAVE ACTIVATED A DANCE TRIPWIRE.</h1>
        <div id="timer">5</div>
        
        <div id="video-container">
            <div id="trap-shield"></div>
            <div id="player"></div>
        </div>
    </div>
<script>
    const HOME_URL = "index.html";
    const SUCCESS_URL = "clearance_granted.html";

    const DANCE_VIDEOS = [
        { id: "ZkXD2XpJnCg", start: 0, duration: 0 },
        { id: "ZkXD2XpJnCg", start: 38, duration: 20 },
        { id: "GxKspeYAFYw", start: 0, duration: 0 }
    ];

    let countdown = 5;
    let tripwireActive = false;
    let timerInterval;
    let successTimeout;
    let glitchInterval;
    let player;
    let selectedVideo;

    const timerDisplay = document.getElementById("timer");
    const statusMessage = document.getElementById("status-message");
    const videoContainer = document.getElementById("video-container");
    const trapShield = document.getElementById("trap-shield");

    function startCountdown() {
        timerDisplay.innerText = countdown;
        timerInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerDisplay.innerText = countdown;
            } else {
                clearInterval(timerInterval);
                timerDisplay.innerText = "LIVE";
                timerDisplay.style.color = "#ff0000";
                activateTripwire();
            }
        }, 1000);
    }

    startCountdown();

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        selectedVideo = DANCE_VIDEOS[Math.floor(Math.random() * DANCE_VIDEOS.length)];

        player = new YT.Player("player", {
            videoId: selectedVideo.id,
            playerVars: {
                autoplay: 1,
                controls: 0,
                disablekb: 1,
                modestbranding: 1,
                rel: 0,
                start: selectedVideo.start,
                mute: 1,
                playsinline: 1
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: handlePlayerStateChange
            }
        });
    }

    function onPlayerReady() {
        const iframe = document.querySelector("#player iframe");
        if (iframe) {
            iframe.setAttribute("allow", "autoplay; encrypted-media");
        }
        if (player && typeof player.playVideo === "function") {
            player.playVideo();
        }
    }

    function activateTripwire() {
        tripwireActive = true;
        statusMessage.innerHTML = "TRIPWIRE ARMED.<br>DO NOT TOUCH CONTROLS. DANCE.";
        videoContainer.style.display = "block";
        trapShield.style.display = "block";

        window.addEventListener("keydown", triggerFail);
        window.addEventListener("mousemove", triggerFail);
        window.addEventListener("mousedown", triggerFail);

        trapShield.addEventListener("mousemove", triggerFail);
        trapShield.addEventListener("mousedown", triggerFail);

        if (selectedVideo && selectedVideo.duration > 0) {
            successTimeout = setTimeout(() => {
                if (tripwireActive) triggerSuccess();
            }, selectedVideo.duration * 1000);
        }
    }

    function handlePlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED && selectedVideo && selectedVideo.duration === 0 && tripwireActive) {
            triggerSuccess();
        }
    }

    function triggerSuccess() {
        if (!tripwireActive) return;

        tripwireActive = false;
        clearTimeout(successTimeout);
        localStorage.setItem("tripwire_passed", "yes");
        
        window.removeEventListener("keydown", triggerFail);
        window.removeEventListener("mousemove", triggerFail);
        window.removeEventListener("mousedown", triggerFail);

        document.body.style.backgroundColor = "#002200";
        statusMessage.style.color = "#00ff00";
        statusMessage.innerText = "CLEARANCE RETAINED. ACCESS GRANTED.";
        timerDisplay.innerText = "PASS";
        timerDisplay.style.color = "#00ff00";
        videoContainer.style.display = "none";

        setTimeout(() => {
            window.location.href = SUCCESS_URL;
        }, 2000);
    }

    function triggerFail() {
        if (!tripwireActive) return;

        tripwireActive = false;
        clearTimeout(successTimeout);
        localStorage.removeItem("tripwire_passed");

        window.removeEventListener("keydown", triggerFail);
        window.removeEventListener("mousemove", triggerFail);
        window.removeEventListener("mousedown", triggerFail);
        trapShield.removeEventListener("mousemove", triggerFail);
        trapShield.removeEventListener("mousedown", triggerFail);

        // Turn on global hardware glitch style
        document.body.classList.add("glitched-state");
        statusMessage.style.animation = "none";
        
        // Active corrupted string generator loop
        const corruptedStrings = [
            "SYSTEM CORRUPTED", "ACCESS DENIED", "REBOOTING SYSTEM...", 
            "FATAL ERROR", "TRIPWIRE DETECTED MOVE", "0x0000007B FAILED"
        ];
        
        glitchInterval = setInterval(() => {
            statusMessage.innerText = corruptedStrings[Math.floor(Math.random() * corruptedStrings.length)];
            timerDisplay.innerText = Math.random().toString(16).substring(2, 6).toUpperCase();
        }, 60);

        videoContainer.style.display = "none";
        trapShield.style.display = "none";

        if (player && typeof player.stopVideo === "function") {
            player.stopVideo();
        }

        setTimeout(() => {
            clearInterval(glitchInterval);
            document.body.classList.remove("glitched-state");
            window.location.href = HOME_URL;
        }, 1800); // Slightly lengthened to let them see the corruption glitch process
    }
</script>
</body>
</html>
