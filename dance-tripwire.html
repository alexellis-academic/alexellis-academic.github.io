<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY WARNING</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            user-select: none;
        }

        #screen-wrapper {
            width: 90%;
            max-width: 800px;
            position: relative;
        }

        h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: blink 1s infinite alternate;
        }

        #timer {
            font-size: 5rem;
            font-weight: bold;
            margin: 20px 0;
            color: #fff;
        }

        #video-container {
            display: none;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border: 2px solid #ff0000;
            margin-top: 20px;
            position: relative; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #trap-shield {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
        }

        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="screen-wrapper">
        <h1 id="status-message">YOU HAVE ACTIVATED A DANCE TRIPWIRE.<br>CLICK ONCE TO ENGAGE SOUND & PROCEED.</h1>
        <div id="timer">3</div>
        
        <div id="video-container">
            <div id="trap-shield"></div>
            <div id="player"></div>
        </div>
    </div>
<script>
    const HOME_URL = "index.html"; 
    const SUCCESS_URL = "clearance_granted.html"; 
    
    // --- CONFIGURATION ---
    const DANCE_VIDEOS = [
        { id: "-bt4cX7dCT8", start: 78, duration: 30 },
        { id: "GxKspeYAFYw", start: 0,  duration: 0 },
        { id: "vIKoVCvqiCE", start: 0,  duration: 0 }
    ];

    let countdown = 3;
    let tripwireActive = false;
    let timerInterval;
    let successTimeout;
    let player;
    let selectedVideo;
    let hasInteracted = false;
    let playerReady = false; // Track if player is ready

    const timerDisplay = document.getElementById('timer');
    const statusMessage = document.getElementById('status-message');
    const videoContainer = document.getElementById('video-container');
    const trapShield = document.getElementById('trap-shield');

    // Load YouTube API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script');
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        selectedVideo = DANCE_VIDEOS[Math.floor(Math.random() * DANCE_VIDEOS.length)];
        
        player = new YT.Player('player', {
            videoId: selectedVideo.id,
            playerVars: {
                'autoplay': 1,
                'controls': 0,    
                'disablekb': 1,  
                'modestbranding': 1,
                'rel': 0,
                'start': selectedVideo.start,
                'mute': 1, 
                'playsinline': 1
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': handlePlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        playerReady = true;
        const iframe = document.getElementById('player');
        if (iframe) {
            iframe.setAttribute('allow', 'autoplay; encrypted-media');
        }

        // Try to play immediately (will work once muted)
        if (player && typeof player.playVideo === 'function') {
            player.playVideo();
        }

        // Wait for first user interaction to unmute and start countdown
        window.addEventListener('click', () => {
            if (!hasInteracted && player && typeof player.unMute === 'function') {
                player.unMute();
                hasInteracted = true;
                startCountdown(); // Start countdown only after first click
            }
        }, { once: true }); // Only fire once
        
        // Also try touch for mobile
        window.addEventListener('touchstart', () => {
            if (!hasInteracted && player && typeof player.unMute === 'function') {
                player.unMute();
                hasInteracted = true;
                startCountdown();
            }
        }, { once: true });
    }

    function startCountdown() {
        timerInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                timerDisplay.innerText = countdown;
            } else if (countdown === 0) {
                clearInterval(timerInterval);
                timerDisplay.innerText = "LIVE";
                timerDisplay.style.color = "#ff0000";
                activateTripwire();
            }
        }, 1000);
    }

    function activateTripwire() {
        tripwireActive = true;
        statusMessage.innerHTML = "TRIPWIRE ARMED.<br>DO NOT TOUCH CONTROLS. DANCE.";
        videoContainer.style.display = "block";
        trapShield.style.display = "block"; 
        
        // Ensure event listeners are attached
        window.addEventListener('keydown', triggerFail, { once: true });
        window.addEventListener('mousemove', triggerFail, { once: true });
        window.addEventListener('mousedown', triggerFail, { once: true });
        
        trapShield.addEventListener('mousemove', triggerFail, { once: true });
        trapShield.addEventListener('mousedown', triggerFail, { once: true });

        if (selectedVideo.duration > 0) {
            successTimeout = setTimeout(() => {
                if (tripwireActive) {
                    triggerSuccess();
                }
            }, selectedVideo.duration * 1000);
        }
    }

    function handlePlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED && selectedVideo.duration === 0 && tripwireActive) {
            triggerSuccess();
        }
    }

    function triggerSuccess() {
        if (!tripwireActive) return; // Prevent double-firing
        
        tripwireActive = false;
        clearTimeout(successTimeout);
        
        // Remove all fail listeners
        window.removeEventListener('keydown', triggerFail);
        window.removeEventListener('mousemove', triggerFail);
        window.removeEventListener('mousedown', triggerFail);

        document.body.style.backgroundColor = "#002200"; 
        statusMessage.style.color = "#00ff00";
        statusMessage.innerText = "CLEARANCE RETAINED. ACCESS GRANTED.";
        timerDisplay.innerText = "PASS";
        timerDisplay.style.color = "#00ff00";
        videoContainer.style.display = "none";

        setTimeout(() => {
            window.location.href = SUCCESS_URL;
        }, 2000);
    }

    function triggerFail() {
        if (!tripwireActive) return;
        
        tripwireActive = false;
        clearTimeout(successTimeout);
        
        statusMessage.innerText = "ACCESS DENIED. REBOOTING SYSTEM...";
        timerDisplay.innerText = "FAIL";
        videoContainer.style.display = "none";
        trapShield.style.display = "none";
        
        if (player && typeof player.stopVideo === 'function') {
            player.stopVideo();
        }

        // Force redirect after short delay
        setTimeout(() => {
            window.location.href = HOME_URL;
        }, 1500);
    }
</script>
</body>
</html>
